# Portal SSO — self-hosting stack.
#
#   cp .env.example .env      # then set the required credentials and public issuer
#   docker compose up -d
#
# Required secrets use ${VAR:?message}, so Compose refuses to start when they are missing.
# Bootstrap credentials are optional: leave them empty to use the setup-key wizard.

name: portal-sso

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-portalsso}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - portal-db-data:/var/lib/postgresql/data
    healthcheck:
      # The app waits on this rather than on the port being open: Postgres accepts connections for
      # a moment before it is ready to answer, and Liquibase running into that loses the race.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published by default. The database is reachable from the app over the compose network and
    # has no reason to be exposed on the host; uncomment only if you need a client on your machine.
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-sso:latest
    stop_grace_period: 45s
    volumes:
      - portal-app-data:/var/lib/portal-sso
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-portalsso}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

      # Must match the URL browsers and relying applications actually use to reach this server —
      # it is published in the OIDC discovery document, and every client validates tokens against
      # it. Behind a reverse proxy this is the public https:// address, not localhost.
      ISSUER_URL: ${ISSUER_URL:?set ISSUER_URL in .env}

      # Protects stored TOTP secrets. Without it MFA enrolment is refused, and if secrets already
      # exist the server refuses to start. Back it up: losing it means every enrolled user re-enrols.
      APP_SECURITY_MFA_ENCRYPTION_KEY: ${APP_SECURITY_MFA_ENCRYPTION_KEY:?set APP_SECURITY_MFA_ENCRYPTION_KEY in .env}

      # Optional bootstrap; leave empty to use the one-time setup-key wizard.
      # Remove both credentials from .env after signing in.
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}

      # Session cookies are marked Secure by default, which means a browser will not send them over
      # plain http. For a local trial without TLS, set SERVER_SERVLET_SESSION_COOKIE_SECURE=false in
      # .env — never in a deployment reachable from anywhere else.
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:-true}

      # FRAMEWORK when a proxy in front of this terminates TLS, so audit entries, login events and
      # rate-limit buckets record the real client rather than the proxy.
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-NATIVE}

      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}

volumes:
  portal-app-data:
  portal-db-data:
